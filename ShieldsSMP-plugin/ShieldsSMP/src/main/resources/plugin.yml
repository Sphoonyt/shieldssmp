name: ShieldsSMP
version: '${project.version}'
main: com.shieldssmp.ShieldsSMP
api-version: '1.21'
description: Shields SMP – Custom Mace Abilities (Dash, Windburst, 3-Hit Launch + Shockwave)
authors: [ ShieldsSMP ]

commands:
  mace:
    description: Receive the Shields SMP Mace
    usage: /mace
    permission: shieldssmp.mace
  macereload:
    description: Reload ShieldsSMP config
    usage: /macereload
    permission: shieldssmp.admin

permissions:
  shieldssmp.mace:
    description: Allows receiving the Shields SMP Mace
    default: op
  shieldssmp.admin:
    description: Admin commands for ShieldsSMP
    default: op
