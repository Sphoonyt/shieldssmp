# ==========================================
#         ShieldsSMP – config.yml
# ==========================================

mace:
  # ── DASH ──────────────────────────────────
  dash:
    # Speed boost on right-click
    velocity: 1.6
    # Cooldown in seconds
    cooldown: 5

  # ── 3-HIT COMBO → LAUNCH ──────────────────
  combo:
    # Hits required to trigger launch
    hits-required: 3
    # Seconds allowed between hits before combo resets
    reset-seconds: 5
    # Y-velocity applied to the attacker (~50 blocks at 3.2)
    launch-velocity: 3.2
    # Cooldown in seconds AFTER landing from a launch
    landing-cooldown-seconds: 30

  # ── LANDING SHOCKWAVE ─────────────────────
  shockwave:
    # Radius of the shockwave (blocks)
    radius: 10.0
    # Knockback force on shockwave victims
    knockback: 2.0
    # Armor durability removed per piece = max-durability * this fraction
    # 0.5 = half of max durability
    armor-damage-fraction: 0.5
    # If true, armor pieces can fully break from the shockwave
    allow-break: false
